name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix worker
      - run: npm ci --prefix web
      - run: npm test --prefix worker
      - run: npm run typecheck --prefix worker
      - run: npm run build --prefix web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix web
      - run: npm run build --prefix web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  worker:
    # Opt in by setting repo variable DEPLOY_WORKER=true and secret CLOUDFLARE_API_TOKEN.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_WORKER == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix worker
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
